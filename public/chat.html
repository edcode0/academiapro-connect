<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - AcademiaPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e293b;
            --accent: #3b82f6;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            display: flex;
            height: 100vh;
        }

        /* Chat UI */
        #chat-container {
            flex: 1;
            display: flex;
            background: white;
            margin: 1.5rem 1.5rem 1.5rem calc(260px + 1.5rem);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        #conversation-list {
            width: 320px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        #search-container {
            padding: 1.25rem;
        }

        #search-input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
            background: #f8fafc;
            outline: none;
        }

        #rooms-scroll {
            flex: 1;
            overflow-y: auto;
        }

        .room-item {
            padding: 1.25rem;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #f1f5f9;
        }

        .room-item:hover {
            background: #f8fafc;
        }

        .room-item.active {
            background: #eff6ff;
            border-left: 4px solid var(--accent);
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #475569;
            flex-shrink: 0;
        }

        .avatar.group {
            background: #dbeafe;
            color: var(--accent);
        }

        .room-info {
            margin-left: 1rem;
            flex: 1;
            min-width: 0;
        }

        .room-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.25rem;
        }

        .room-name {
            font-weight: 700;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .last-msg {
            font-size: 0.85rem;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background: #ef4444;
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 0.5rem;
        }

        #active-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        #chat-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
        }

        #messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: #f8fafc;
        }

        .msg {
            max-width: 75%;
            display: flex;
            flex-direction: column;
        }

        .msg.sent {
            align-self: flex-end;
        }

        .msg.received {
            align-self: flex-start;
        }

        .bubble {
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .msg.sent .bubble {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 0.25rem;
        }

        .msg.received .bubble {
            background: #f1f5f9;
            border: none;
            border-bottom-left-radius: 0.25rem;
        }

        .msg-info {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 0.25rem;
            display: flex;
            gap: 0.5rem;
        }

        .msg.sent .msg-info {
            justify-content: flex-end;
        }

        #input-area {
            padding: 1.25rem;
            border-top: 1px solid var(--border);
        }

        .input-container {
            display: flex;
            align-items: flex-end;
            gap: 0.75rem;
            background: #f1f5f9;
            padding: 0.5rem;
            border-radius: 0.75rem;
        }

        #msg-input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 0.5rem;
            outline: none;
            resize: none;
            max-height: 120px;
            font-size: 0.95rem;
        }

        .send-btn {
            background: var(--accent);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        @media (max-width: 1024px) {
            #chat-container {
                margin: 0;
                border-radius: 0;
                border: none;
            }

            #conversation-list {
                width: 100% !important;
            }

            #active-chat {
                display: none;
            }

            #active-chat.active {
                display: flex !important;
                width: 100% !important;
            }

            #conversation-list.hidden {
                display: none !important;
            }

            #mobile-chat-bar {
                display: flex;
            }
        }

        #mobile-chat-bar {
            display: none;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid var(--border);
            background: white;
        }

        #mobile-chat-bar span {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-main);
        }
    </style>
    <link rel="stylesheet" href="/glassmorphism.css">
    <link rel="stylesheet" href="/shared-dashboard.css">
</head>

<body>

        <p id="loadingText">Cargando...</p>

    <!-- BG Blobs -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div id="sidebar-mount" data-role="admin"></div>
    <script src="/sidebar.js"></script>

    <div id="chat-container">
        <div id="conversation-list">
            <div id="mobile-chat-bar">
                <button class="hamburger-btn" onclick="toggleMobileNav()">&#9776;</button>
                <span>Conversaciones</span>
            </div>
            <div id="search-container">
                <input type="text" id="search-input" placeholder="Buscar conversaciones...">
            </div>
            <div id="rooms-scroll"></div>
        </div>

        <div id="active-chat">
            <div id="empty-state"
                style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8;">
                <p>Selecciona una conversación para empezar</p>
            </div>
            <div id="chat-box" style="display: none; height: 100%; flex-direction: column;">
                <header id="chat-header">
                <button class="hamburger-btn" onclick="toggleMobileNav()">&#9776;</button>
                <button id="back-btn" onclick="showListMobile()" style="display:none; background:none; border:none; cursor:pointer; font-size:1.1rem; padding:0.25rem 0.5rem; margin-right:0.5rem; color:var(--accent); font-weight:600;">&#8592; Volver</button>

                    <div id="header-avatar" class="avatar"></div>
                    <div class="room-info">
                        <div id="header-name" class="room-name"></div>
                        <div id="header-badge" style="font-size: 0.7rem; color: #64748b;"></div>
                    </div>
                </header>
                <div id="messages-area"></div>
                <div id="typing-indicator"
                    style="padding: 0.5rem 1.5rem; font-size: 0.75rem; color: #94a3b8; font-style: italic; display: none;">
                </div>
                <div id="file-preview-container"
                    style="display: none; padding: 0.5rem 1.5rem; background: #f8fafc; border-top: 1px solid var(--border); align-items: center; gap: 1rem;">
                    <div id="file-preview-content"
                        style="display: flex; align-items: center; gap: 0.5rem; background: white; padding: 0.5rem 1rem; border-radius: 0.5rem; border: 1px solid var(--border);">
                    </div>
                </div>
                <div id="input-area">
                    <div class="input-container">
                        <button class="btn-attach" id="attach-btn"
                            style="background:none; border:none; cursor:pointer; font-size:1.25rem;">📎</button>
                        <input type="file" id="file-picker" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"
                            style="display: none;">
                        <textarea id="msg-input" placeholder="Escribe un mensaje..." rows="1"></textarea>
                        <div class="send-btn" id="send-btn">➤</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Auth via httpOnly cookie — redirect to login if unauthenticated
        let _socketToken = null;

        const socket = io({
            auth: (cb) => cb({ token: _socketToken }),
            withCredentials: true,
            transports: ['websocket', 'polling']
        });

        let currentUser = null;
        let activeRoom = null;
        let currentRoomId = null;
        let allRooms = [];
        const pendingTempIds = new Set();

        socket.on('connect', () => {
            console.log('Socket connected:', socket.id);
            loadRooms();
        });

        socket.on('connect_error', (err) => {
            console.error('Socket error:', err.message);
            if (err.message === 'No token' || err.message === 'Invalid token') {
                window.location.href = '/login';
            }
        });

        socket.on('new_message', (message) => {
            console.log('New message received:', message);
            if (currentRoomId === message.room_id) {
                // Deduplicate: if this is our own optimistic message echoed back, replace the temp element
                if (message.tempId && pendingTempIds.has(message.tempId)) {
                    pendingTempIds.delete(message.tempId);
                    const tempEl = document.querySelector(`[data-temp-id="${message.tempId}"]`);
                    if (tempEl) {
                        tempEl.removeAttribute('data-temp-id');
                        tempEl.dataset.id = message.id;
                        return;
                    }
                }
                appendMessage(message);
                markRoomAsRead(message.room_id);
            }
            updateRoomLastMessage(message.room_id, message.content);
        });

        async function init() {
            const userRes = await fetch('/auth/me', { credentials: 'include' });
            if (!userRes.ok) window.location.href = '/login';
            currentUser = await userRes.json();

            try { await fetch('/api/chat/ensure-rooms', { method: 'POST', credentials: 'include' }); } catch (e) { console.error(e); }
            await loadRooms();
            updateTotalUnread();

            document.getElementById('search-input').oninput = (e) => {
                const term = e.target.value.toLowerCase();
                renderRooms(allRooms.filter(r => (r.name || '').toLowerCase().includes(term)));
            };

            document.getElementById('msg-input').onkeydown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
            };

            document.getElementById('send-btn').onclick = () => sendMessage();

            // Attachment button opens file picker
            document.getElementById('attach-btn').onclick = () => document.getElementById('file-picker').click();

            // File picker: upload then send as message
            document.getElementById('file-picker').onchange = async (e) => {
                const file = e.target.files[0];
                if (!file || !currentRoomId) return;
                try {
                    const formData = new FormData();
                    formData.append('file', file);
                    const uploadRes = await fetch('/api/chat/upload-file', {
                        method: 'POST',
                        credentials: 'include',
                        body: formData
                    });
                    if (!uploadRes.ok) { console.error('Upload failed:', await uploadRes.text()); return; }
                    const fileData = await uploadRes.json();
                    await fetch(`/api/chat/rooms/${currentRoomId}/messages`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ content: fileData.file_name, file_url: fileData.file_url, file_name: fileData.file_name, file_type: fileData.file_type })
                    });
                } catch (err) {
                    console.error('File send error:', err);
                } finally {
                    e.target.value = '';
                }
            };
        }

        async function loadRooms() {
            const res = await fetch('/api/chat/rooms', {
                credentials: 'include'
            });
            allRooms = await res.json();
            renderRooms(allRooms);
            socket.emit('join_rooms', allRooms.map(r => r.id));

            // Auto-open room from URL param ?room=ROOM_ID (deep-link from notifications)
            const urlParams = new URLSearchParams(window.location.search);
            const targetRoomId = urlParams.get('room');
            if (targetRoomId) {
                const targetRoom = allRooms.find(r => String(r.id) === String(targetRoomId));
                if (targetRoom) selectRoom(targetRoom);
            }
        }

        function renderRooms(rooms) {
            rooms = rooms.filter(r => r !== null && r !== undefined && r.id);
            const container = document.getElementById('rooms-scroll');

            // Fix sorting: pin group chat to the top, then sort by latest activity
            rooms.sort((a, b) => {
                if (a.type === 'group' && b.type !== 'group') return -1;
                if (a.type !== 'group' && b.type === 'group') return 1;
                const dateA = new Date(a.last_message_date || a.created_at || 0).getTime();
                const dateB = new Date(b.last_message_date || b.created_at || 0).getTime();
                return dateB - dateA;
            });

            container.innerHTML = rooms.map(room => {
                const initials = escapeHtml((room.name || 'Chat').split(' ').map(n => n[0]).join('').substring(0, 2));
                return `
                    <div class="room-item ${activeRoom && activeRoom.id === room.id ? 'active' : ''}" onclick="selectRoom(${JSON.stringify(room).replace(/"/g, '&quot;')})">
                        <div class="avatar ${room.type === 'group' ? 'group' : ''}">${initials}</div>
                        <div class="room-info">
                            <div class="room-header">
                                <span class="room-name">${escapeHtml(room.name || 'Chat')}</span>
                            </div>
                            <div class="last-msg">${escapeHtml(room.last_message || 'Sin mensajes')}</div>
                        </div>
                        ${room.unread_count > 0 ? `<div class="unread-badge">${room.unread_count}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function showChatMobile() {
            if (window.innerWidth <= 768) {
                document.getElementById('conversation-list').classList.add('hidden');
                document.getElementById('active-chat').classList.add('active');
                document.getElementById('back-btn').style.display = 'inline-block';
            }
        }

        function showListMobile() {
            if (window.innerWidth <= 768) {
                document.getElementById('conversation-list').classList.remove('hidden');
                document.getElementById('active-chat').classList.remove('active');
                document.getElementById('back-btn').style.display = 'none';
            }
        }

        async function selectRoom(room) {
            activeRoom = room;
            currentRoomId = room.id;
            showChatMobile();
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('chat-box').style.display = 'flex';
            document.getElementById('header-name').textContent = room.name || 'Chat';
            document.getElementById('header-badge').textContent = room.type === 'group' ? 'Grupo' : room.other_role;
            document.getElementById('header-avatar').textContent = (room.name || 'Chat')[0];

            // ALWAYS clear messages first
            const container = document.getElementById('messages-area');
            container.innerHTML = '';

            // Join socket room
            socket.emit('join_room', room.id);

            // Fetch only messages for THIS room
            const res = await fetch(`/api/chat/rooms/${room.id}/messages`, {
                credentials: 'include'
            });
            const messages = await res.json();

            // Render only these messages
            if (Array.isArray(messages)) {
                renderMessages(messages);
            }

            await fetch(`/api/chat/mark-read/${room.id}`, { method: 'POST', credentials: 'include' });
            loadRooms();
            updateTotalUnread();
        }

        function renderMessage(msg) {
            const isMine = msg.sender_id === currentUser.id;
            let fileHTML = '';

            if (msg.file_url) {
                const safeUrl = encodeURI(msg.file_url);
                const safeName = escapeHtml(msg.file_name);
                if (msg.file_type && msg.file_type.startsWith('image/')) {
                    fileHTML = `<img src="${safeUrl}" style="max-width:200px;border-radius:8px;margin-top:4px;display:block;">`;
                } else if (msg.file_type === 'application/pdf') {
                    fileHTML = `<a href="${safeUrl}" target="_blank" style="display:flex;align-items:center;gap:6px;background:rgba(99,102,241,0.1);padding:8px 12px;border-radius:8px;margin-top:4px;text-decoration:none;color:#6366f1;">📄 ${safeName} <span style="font-size:0.8em">Abrir PDF</span></a>`;
                } else {
                    fileHTML = `<a href="${safeUrl}" target="_blank" style="display:flex;align-items:center;gap:6px;background:rgba(99,102,241,0.1);padding:8px 12px;border-radius:8px;margin-top:4px;text-decoration:none;color:#6366f1;">📎 ${safeName}</a>`;
                }
            }

            return `<div class="msg ${isMine ? 'sent' : 'received'}" data-id="${msg.id}">
        <div class="bubble">
            ${msg.content ? `<div>${msg.type === 'html_card' ? msg.content : escapeHtml(msg.content)}</div>` : ''}
            ${fileHTML}
        </div>
        <div class="msg-info">
            ${!isMine ? `<span>${escapeHtml(msg.sender_name || (activeRoom && activeRoom.name) || '')}</span>` : ''}
            <span class="time">${new Date(msg.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
        </div>
    </div>`;
        }

        function renderMessages(messages) {
            const area = document.getElementById('messages-area');
            area.innerHTML = messages.map(msg => renderMessage(msg)).join('');
            area.scrollTop = area.scrollHeight;
        }

        function appendMessage(msg) {
            const area = document.getElementById('messages-area');
            const duplicate = area.querySelector(`.msg[data-id="${msg.id}"]`);
            if (duplicate) return;
            area.insertAdjacentHTML('beforeend', renderMessage(msg));
            area.scrollTop = area.scrollHeight;
        }

        async function markRoomAsRead(roomId) {
            await fetch(`/api/chat/mark-read/${roomId}`, { method: 'POST', credentials: 'include' });
            updateTotalUnread();
        }

        function updateRoomLastMessage(roomId, content) {
            const room = allRooms.find(r => r.id === roomId);
            if (room) {
                room.last_message = content;
                renderRooms(allRooms);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const content = input.value.trim();
            if (!content || !currentRoomId) return;

            // Generate a unique tempId for deduplication
            const tempId = 'temp-' + Date.now() + '-' + Math.random().toString(36).slice(2);
            pendingTempIds.add(tempId);

            // Optimistic UI update — append element with data-temp-id so we can match it later
            const tempMessage = {
                id: 'temp_' + Date.now(),
                room_id: currentRoomId,
                sender_id: currentUser.id,
                sender_name: currentUser.name,
                sender_role: currentUser.role,
                content: content,
                created_at: new Date().toISOString()
            };
            const area = document.getElementById('messages-area');
            const tempHTML = renderMessage(tempMessage);
            // Insert and immediately tag with data-temp-id
            area.insertAdjacentHTML('beforeend', tempHTML);
            const tempEl = area.lastElementChild;
            tempEl.dataset.tempId = tempId;
            area.scrollTop = area.scrollHeight;

            input.value = '';

            // Send via socket, including tempId so the server echoes it back
            socket.emit('sendMessage', { roomId: currentRoomId, content, tempId });
        }

        async function updateTotalUnread() {
            const res = await fetch('/api/chat/unread-count', { credentials: 'include' });
            const data = await res.json();
            const badge = document.getElementById('global-unread');
            if (badge) {
                if (data.count > 0) { badge.textContent = data.count; badge.style.display = 'block'; }
                else badge.style.display = 'none';
            }
        }

        init();
    </script>
<script src="/help-assistant.js"></script>
<script src="/global.js"></script>
